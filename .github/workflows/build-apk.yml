name: Build Yemen 4x4 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract game project
        run: |
          mkdir -p game
          unzip -q Yemen_4x4_Offroad_Build_Fixed.zip -d extracted
          test -f extracted/yemen_4x4_offroad/package.json
          cp -a extracted/yemen_4x4_offroad/. game/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: game
        run: npm install --no-audit --no-fund

      - name: Build web game
        working-directory: game
        run: npm run build

      - name: Create Android wrapper
        working-directory: game
        run: npx cap add android

      - name: Sync Android assets
        working-directory: game
        run: npx cap sync android

      - name: Build debug APK
        working-directory: game/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Yemen-4x4-Android-APK
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
